{% macro pagination(page, pages, total, page_size) -%}
<div class="pagination" data-page="{{ page }}">
  <span>共 {{ total }} 条 · 每页 {{ page_size }} 条</span>
  {% if pages > 1 %}
  <button class="btn btn-sm" data-page="{{ page - 1 }}" {% if page <= 1 %}disabled{% endif %}>上一页</button>
  {% for p in range(1, pages + 1) %}
  <button class="btn btn-sm {% if p == page %}active{% endif %}" data-page="{{ p }}">{{ p }}</button>
  {% endfor %}
  <button class="btn btn-sm" data-page="{{ page + 1 }}" {% if page >= pages %}disabled{% endif %}>下一页</button>
  {% endif %}
</div>
{%- endmacro %}
