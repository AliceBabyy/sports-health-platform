{% extends "base.html" %}
{% block title %}生理周期 · 体序{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="/static/css/pages/cycle.css?v=20261112a">{% endblock %}
{% block content %}
<div class="page-head">
  <h1>生理周期</h1>
  <div class="page-head-actions">
    <button class="btn" id="btnCycleSettings">周期参数</button>
    <button class="btn btn-primary" id="btnRecordPeriod">＋ 记录月经</button>
  </div>
</div>

<div class="two-col cycle-layout">
  <div class="three-row-stack">
    <div class="card">
      <div class="calendar-head">
        <div>
          <div class="calendar-title" id="calTitle">—</div>
          <div class="calendar-sub" id="calSub"></div>
        </div>
        <div class="cal-nav">
          <button class="btn btn-sm cal-nav-btn" id="btnPrevMonth" aria-label="上月" title="上月">‹</button>
          <button class="btn btn-sm" id="btnGoToday">今天</button>
          <button class="btn btn-sm cal-nav-btn" id="btnNextMonth" aria-label="下月" title="下月">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calWeekday">
        <div class="cal-weekday">一</div><div class="cal-weekday">二</div><div class="cal-weekday">三</div>
        <div class="cal-weekday">四</div><div class="cal-weekday">五</div><div class="cal-weekday">六</div><div class="cal-weekday">日</div>
      </div>
      <div class="cal-grid" id="calGrid" style="margin-top:6px"></div>
      <div class="legend">
        <span class="legend-block"><span class="swatch sw-high"></span>精力旺盛</span>
        <span class="legend-block"><span class="swatch sw-good"></span>状态良好</span>
        <span class="legend-block"><span class="swatch sw-average"></span>状态一般</span>
        <span class="legend-block"><span class="swatch sw-rest"></span>适合休息</span>
      </div>
      <div class="legend legend-period">
        <span class="legend-block"><span class="swatch sw-period-recorded"></span>经期</span>
        <span class="legend-block"><span class="swatch sw-period-inferred"></span>推算经期</span>
        <span class="legend-block"><span class="swatch sw-period-predicted"></span>预测经期</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">月经记录</div>
      <div id="periodList" class="period-list"></div>
    </div>
  </div>

  <div>
    <div class="card day-detail" id="dayDetail"></div>
  </div>
</div>

<!-- 记录月经弹窗 -->
<div class="modal-mask" id="modalPeriod">
  <div class="modal">
    <div class="modal-title">记录月经</div>
    <form id="formPeriod">
      <div class="form-grid">
        <div class="form-item"><label class="field-label">月经开始日期</label><input class="input" type="date" name="start_date" required></div>
        <div class="form-item"><label class="field-label">结束日期（可选）</label><input class="input" type="date" name="end_date"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" data-close="modalPeriod">取消</button>
        <button type="submit" class="btn btn-primary">保存记录</button>
      </div>
    </form>
  </div>
</div>
<div class="modal-mask" id="modalEditPeriod">
  <div class="modal">
    <div class="modal-title">编辑月经记录</div>
    <form id="formEditPeriod">
      <input type="hidden" name="record_id">
      <div class="form-grid">
        <div class="form-item"><label class="field-label">开始日期</label><input class="input" type="date" name="start_date" required></div>
        <div class="form-item"><label class="field-label">结束日期</label><input class="input" type="date" name="end_date"></div>
      </div>
      <div class="modal-actions"><button type="button" class="btn" data-close="modalEditPeriod">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
    </form>
  </div>
</div>

<!-- 周期参数（参考值） -->
<div class="modal-mask" id="modalSettings">
  <div class="modal">
    <div class="modal-title">周期参数</div>
    <form id="formSettings">
      <div class="form-grid">
        <div class="form-item"><label class="field-label">参考周期 (天)</label><input class="input num" type="number" name="cycle_length" min="22" max="45" required></div>
        <div class="form-item"><label class="field-label">参考经期 (天)</label><input class="input num" type="number" name="period_length" min="2" max="8" required></div>
      </div>
      <div class="settings-note">历史周期按记录自动计算；此值只用于推算当前周期与下一次。</div>
      <div class="modal-actions"><button type="button" class="btn" data-close="modalSettings">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>window.INIT_CAL = {{ calendar | tojson }};
window.INIT_SETTINGS = {{ settings | tojson }};
window.PHASE_INFO = {{ phase_info | tojson }};
window.TODAY_STR = '{{ today.isoformat() }}';</script>
<script src="/static/js/cycle.js?v=20261112a"></script>
{% endblock %}
