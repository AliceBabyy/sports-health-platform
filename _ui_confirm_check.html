<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>统一删除确认弹窗测试</title>
<link rel="stylesheet" href="http://127.0.0.1:8010/static/css/tokens.css?v=14">
<link rel="stylesheet" href="http://127.0.0.1:8010/static/css/base.css?v=14">
<link rel="stylesheet" href="http://127.0.0.1:8010/static/css/layout.css?v=14">
<style>
  body { padding: 44px; background: var(--bg-page); }
  .demo { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .log { font-size: 13px; color: var(--color-text-secondary); }
</style>
</head>
<body>
  <div class="demo">
    <button class="btn btn-danger" id="b1">删除身材记录</button>
    <button class="btn btn-danger" id="b2">删除训练计划</button>
    <button class="btn btn-danger" id="b3">删除舞蹈记录</button>
    <button class="btn btn-danger" id="b4">删除游泳记录</button>
  </div>
  <div class="log" id="log">尚未操作</div>
  <script src="http://127.0.0.1:8010/static/js/common.js?v=14"></script>
  <script>
    function log(t) { document.getElementById('log').textContent = '结果: ' + t; }
    document.getElementById('b1').addEventListener('click', function () {
      App.confirmDialog({ title: '删除身材记录', message: '确定删除 2026-11-02 的全部身材记录吗？删除后不可恢复。' })
        .then(function (ok) { log('身材记录 → ' + (ok ? '确认删除' : '已取消')); });
    });
    document.getElementById('b2').addEventListener('click', function () {
      App.confirmDialog({ title: '删除训练计划', message: '确定删除该训练计划？其下的动作明细将一并删除。' })
        .then(function (ok) { log('训练计划 → ' + (ok ? '确认删除' : '已取消')); });
    });
    document.getElementById('b3').addEventListener('click', function () {
      App.confirmDialog({ title: '删除舞蹈记录', message: '确定删除这条舞蹈记录吗？删除后不可恢复。' })
        .then(function (ok) { log('舞蹈记录 → ' + (ok ? '确认删除' : '已取消')); });
    });
    document.getElementById('b4').addEventListener('click', function () {
      App.confirmDialog({ title: '删除游泳记录', message: '确定删除这条游泳记录吗？删除后不可恢复。' })
        .then(function (ok) { log('游泳记录 → ' + (ok ? '确认删除' : '已取消')); });
    });
  </script>
</body>
</html>
