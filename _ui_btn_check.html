<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>按钮新样式采样</title>
<link rel="stylesheet" href="http://127.0.0.1:8010/static/css/tokens.css?v=13">
<link rel="stylesheet" href="http://127.0.0.1:8010/static/css/base.css?v=13">
<link rel="stylesheet" href="http://127.0.0.1:8010/static/css/pages/cycle.css?v=13">
<link rel="stylesheet" href="http://127.0.0.1:8010/static/css/pages/dance.css?v=13">
<style>
  body { background: var(--bg-page); padding: 40px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 22px; }
  .label { font-size: 12px; color: var(--color-text-secondary); width: 120px; flex: none; }
</style>
</head>
<body>
  <div class="row">
    <span class="label">主按钮</span>
    <button class="btn btn-primary">主操作</button>
    <button class="btn btn-primary" disabled>禁用态</button>
  </div>
  <div class="row">
    <span class="label">次按钮</span>
    <button class="btn">次按钮</button>
    <button class="btn btn-danger">危险操作</button>
  </div>
  <div class="row">
    <span class="label">筛选 chip 激活</span>
    <span class="chip active">舞蹈</span>
    <span class="chip">全部</span>
  </div>
  <div class="row">
    <span class="label">疼痛程度选中</span>
    <button class="pain-btn active">轻度疼痛</button>
    <button class="pain-btn">无痛</button>
  </div>
  <div class="row">
    <span class="label">分页激活</span>
    <div class="pagination" style="margin:0"><button class="active">1</button><button>2</button><button>3</button></div>
  </div>
</body>
</html>
