<header class="topbar">
  <div class="topbar-left">
    <button class="sidebar-toggle" id="sidebarToggle" title="收起/展开侧边栏" aria-label="收起或展开侧边栏">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
    <div class="breadcrumb">个人健康 / <b>{{ page_title }}</b></div>
  </div>
  <div class="topbar-right">
    <span class="topbar-date num">{{ today_str }} {{ weekday_cn }}</span>
    <span class="user-chip">
      <span class="user-avatar">{{ (user.display_name or user.username)[:1] }}</span>
      {{ user.display_name or user.username }}
    </span>
    <a class="logout" href="/logout">退出</a>
  </div>
</header>
