<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}体序 · BODY ALMANAC{% endblock %}</title>
<link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/tokens.css?v=20261106b">
<link rel="stylesheet" href="/static/css/base.css?v=20261106b">
<link rel="stylesheet" href="/static/css/layout.css?v=20261106g">
{% block extra_css %}{% endblock %}
</head>
<body>
{% if user is defined and user %}
<div class="app-shell">
  {% include "layout/sidebar.html" %}
  <div class="main">
    {% include "layout/topbar.html" %}
    <main class="content">{% block content %}{% endblock %}</main>
  </div>
</div>
{% else %}
{% block standalone %}{% endblock %}
{% endif %}
<div class="toast-wrap" id="toastWrap"></div>

<!-- 通用查看详情弹窗（健身/游泳/舞蹈「全部记录」操作列共用，2026-11-04） -->
<div class="modal-mask" id="modalDetail">
  <div class="modal" style="width:560px">
    <div class="modal-title" id="detailTitle">查看详情</div>
    <div class="modal-desc" id="detailSub"></div>
    <div id="detailBody"></div>
    <div class="modal-actions">
      <button class="btn" data-close="modalDetail">关闭</button>
    </div>
  </div>
</div>

<script src="/static/js/common.js?v=20261108d"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
