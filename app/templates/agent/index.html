{% extends "base.html" %}
{% block title %}AI 助手 · 体序{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="/static/css/pages/agent.css?v=20261113b">{% endblock %}
{% block content %}
<div class="agent-workbench" id="agentWorkbench">
  <!-- 会话列表 -->
  <aside class="agent-sessions" id="agentSessions">
    <button class="btn btn-ghost session-new" id="btnNewChat" type="button">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      </svg>
      新建会话
    </button>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <!-- 对话区 -->
  <section class="agent-chat">
    <div class="chat-head">
      <button class="session-toggle" id="btnToggleSessions" type="button" title="收起/展开会话列表" aria-label="收起或展开会话列表">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
          <rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/>
          <line x1="6.5" y1="3" x2="6.5" y2="13" stroke="currentColor" stroke-width="1.3"/>
        </svg>
      </button>
      <div class="chat-title" id="chatTitle"></div>
      <select class="select chat-model" id="chatModel" aria-label="选择模型">
        <option value="">默认模型</option>
        {% for m in model_options %}
        <option value="{{ m }}">{{ m }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="message-scroll" id="messageScroll">
      <div class="chat-welcome" id="chatWelcome">
        <h2 class="welcome-title" id="welcomeTitle"></h2>
      </div>
      <div class="message-list" id="messageList"></div>
    </div>

    <div class="chat-composer-wrap">
      <div class="chat-input">
        <textarea class="input" id="chatInput" rows="1" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
        <div class="composer-row">
          <button class="send-btn" id="btnSend" type="button" title="发送" aria-label="发送">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M8 12V4M3.5 8.5 8 4l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </section>
</div>
{% endblock %}
{% block extra_js %}
<script>
window.INIT_CONVERSATIONS = {{ conversations | tojson }};
window.MODEL_OPTIONS = {{ model_options | tojson }};
window.DEFAULT_MODEL = {{ default_model | tojson }};
</script>
<script src="/static/js/agent.js?v=20261113b"></script>
{% endblock %}
